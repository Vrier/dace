# ===========================================================================
# DACE — test, then release to the server.
#
# The server pulls: a cron job installed by deploy/setup-server.sh moves
# /srv/dace to branch "live" every two minutes. This workflow points "live"
# at a commit only after `npm test` passes (the test rebuilds the site from
# src/ + data/ + docs-src/ and fails if the committed site/ is out of date),
# so a red run never reaches the server. No SSH key or secret is needed.
# ===========================================================================
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build tools
        run: npm ci --no-audit --no-fund

      - name: Checks (data, doc links, Judge export round trip, site/ up to date)
        run: npm test

      - name: Release (move branch live here; the server picks it up within 2 minutes)
        run: git push --force origin HEAD:refs/heads/live
