<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--accent:{{accent}};--accent-tint:{{accentTint}};--ink:#23201a;--ink-soft:#6d6453;--ink-faint:#a39c8f;--bg:#f4efe3;--panel:#fffdf7;--line:#e3dac6;--serif:'Newsreader',Georgia,serif;--ui:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6}
.page{max-width:800px;margin:0 auto;padding:40px 24px 80px}
h1{font-family:var(--serif);font-size:36px;font-weight:600;color:var(--ink);border-bottom:2px solid var(--accent);padding-bottom:12px;margin-top:48px}
h2{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--ink);margin-top:44px;border-bottom:1px solid var(--line);padding-bottom:8px}
h3{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);margin-top:32px}
h4{font-family:var(--serif);font-size:17px;font-weight:600;font-style:italic;color:var(--ink-soft);margin-top:20px}
p{margin:10px 0;text-wrap:pretty}
em{font-style:italic}
strong{font-weight:600}
code{font-family:var(--mono);font-size:13px;background:rgba(0,0,0,.07);padding:1px 5px;border-radius:4px}
pre{background:#2b2820;color:#e8e4da;padding:18px 20px;border-radius:10px;overflow-x:auto;font-size:13px;line-height:1.55}
pre code{background:none;padding:0;font-size:inherit}
blockquote{margin:16px 0;padding:10px 18px;border-left:3px solid var(--accent);background:var(--accent-tint);border-radius:0 8px 8px 0}
blockquote p{margin:4px 0;font-family:var(--serif);font-style:italic;font-size:15px}
ul{padding-left:22px;margin:10px 0}
li{margin:4px 0}
hr{border:none;border-top:1px solid var(--line);margin:32px 0}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin:18px 0;font-size:13.5px}
th{background:var(--panel);border:1px solid var(--line);padding:8px 12px;text-align:left;font-weight:600}
td{border:1px solid var(--line);padding:7px 12px}
tr:nth-child(even) td{background:rgba(0,0,0,.025)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.back-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);padding:8px 16px;border-radius:20px;font-size:13px;text-decoration:none;margin-bottom:32px}
.back-btn:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="page">
<a class="back-btn" href="../">← Back to DACE Explorer</a>
{{body}}</div>
</body>
</html>
